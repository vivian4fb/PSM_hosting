name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pytest
      - run: cd python && python -m pytest -q
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/models.test.js
  wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbid the mis-expansions that exist in the archive
        run: |
          ! grep -rIn --exclude-dir=.git -E "Primary Smith|co-originator" . || (echo "forbidden wording found" && exit 1)
